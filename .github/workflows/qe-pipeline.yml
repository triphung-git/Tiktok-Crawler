name: Quality Engineering & Test Automation CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-engineering-audit:
    name: Run Test Automation & Code Quality Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Install Playwright Chromium Drivers
        run: |
          playwright install --with-deps chromium

      - name: Execute Automated QA Test Suite with Coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Verify SQL Data Integrity Tests
        run: |
          pytest tests/db/ -v

      - name: Verify API Contract Tests
        run: |
          pytest tests/api/ -v

      - name: Verify Playwright UI Automation Tests
        run: |
          pytest tests/ui/ -v

      - name: Upload Test Coverage Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qe-coverage-report
          path: coverage.xml
          retention-days: 14
